<!DOCTYPE html>
<html>
<head>
 
    <title>Unordered List </title>
</head>
<body>

    <!-- attribute : Circle, disc, square  -->
     <!-- By default use Disc  -->

         <ul type="">
        <li>Cat</li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
         </ul>
     <hr>
     <h1>Circle</h1>
     <ul type="Circle">
        <li>Cat</li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
     </ul>
     <hr>
     <h1>Square </h1>
     <ul type="square">
        <li><a href="https://hareetech.com/index.php">Home</a> </li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
     </ul>
</body>
</html>


<!-- WAP where use unordered List to  print a navbar of any website  -->
