<!-- ol type a, A, i, I -->

     <ol type="A">
        <li>Cat</li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
     </ol>
     <hr>
     <ol type="a">
        <li>Cat</li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
     </ol>
     <hr>
     <ol type="I">
        <li>Cat</li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
     </ol>
     <hr>
     <ol type="i">
        <li>Cat</li>
        <li>Dog</li>
        <li>Cow</li>
        <li>Frog</li>
        <li>Fish</li>
     </ol>
</body>
