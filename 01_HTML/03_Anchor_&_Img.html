<!DOCTYPE html>
<html>
    <head>
        <title>Img and Anchor</title>
    </head>
    <body>
        <a href="https://www.google.com">
            <img src="images/test.png"  alt="Hello"/>
        </a>
        <a href="https://www.google.com" target="_blank">
            <img src="images/test.png"  alt="Hello" />
        </a>
    </body>
</html>


<!-- WAP where use heading tags then anchor tags then img with redirection -->
