<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Complete Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5">

    <div class="card shadow">
-
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Bootstrap Complete Form Example</h3>
        </div>

        <div class="card-body">

            <form>

                <!-- ================= Row 1 (2 Columns) ================= -->

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="Enter First Name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Enter Last Name">
                    </div>

                </div>

                <!-- ================= Row 2 (4 Columns) ================= -->

                <div class="row mb-3">

                    <div class="col-md-3">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Time</label>
                        <input type="time" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Favorite Color</label>
                        <input type="color" class="form-control form-control-color">
                    </div>

                </div>

                <!-- ================= Row 3 (3 Columns) ================= -->

                <div class="row mb-3">

                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control">
                    </div>

                </div>

                <!-- ================= Row 4 (2 Columns) ================= -->

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Country</label>

                        <select class="form-select">

                            <option selected>Select Country</option>
                            <option>India</option>
                            <option>USA</option>
                            <option>Canada</option>
                            <option>Australia</option>

                        </select>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label">City</label>

                        <select class="form-select">

                            <option selected>Select City</option>
                            <option>Lucknow</option>
                            <option>Delhi</option>
                            <option>Mumbai</option>
                            <option>Pune</option>

                        </select>

                    </div>

                </div>

                <!-- ================= Row 5 (Radio + Checkbox) ================= -->

                <div class="row mb-3">

                    <div class="col-md-6">

                        <label class="form-label d-block">Gender</label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender">
                            <label class="form-check-label">Male</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender">
                            <label class="form-check-label">Female</label>
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label d-block">Skills</label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">HTML</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">CSS</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Bootstrap</label>
                        </div>

                    </div>

                </div>

                <!-- ================= Row 6 (File + Search) ================= -->

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Upload Resume</label>
                        <input type="file" class="form-control" accept>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Search</label>
                        <input type="search" class="form-control" placeholder="Search...">
                    </div>

                </div>

                <!-- ================= Row 7 (URL + Range) ================= -->

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Portfolio URL</label>
                        <input type="url" class="form-control" placeholder="https://">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Experience Level</label>
                        <input type="range" class="form-range">
                    </div>

                </div>

                <!-- ================= Row 8 (Full Width) ================= -->

                <div class="row mb-3">

                    <div class="col-12">

                        <label class="form-label">Address</label>

                        <textarea class="form-control" rows="4"></textarea>

                    </div>

                </div>

                <!-- ================= Row 9 (Buttons) ================= -->

                <div class="row">

                    <div class="col text-center">

                        <button class="btn btn-primary px-4">
                            Submit
                        </button>

                        <button class="btn btn-danger px-4">
                            Reset
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
