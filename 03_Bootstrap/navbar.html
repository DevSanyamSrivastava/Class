<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .fa-brands {
        font-size: 30px;
        margin-top: 3%;
        color:#8E0000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row w-100 " style="height: 100px">
        <div class="col-lg-1 col-md-12 h-100" style="">
          <img src="https://aktu.ac.in/images/logo.png" />
        </div>
        <div class="col-lg-6 col-md-12" style="">
          <img
            src="https://aktu.ac.in/images/AKTU%20Logo.png"
            alt=""
            class="h-100 w-100"
          />
        </div>
        
        <div class="col-lg-3 col-md-12 " style="">
          <div class="row">
            <div class="col-lg-12 col-md-12">
              <i class="fa-brands fa-facebook-f"></i>
              <i class="fa-brands fa-linkedin-in"></i>
              <i class="fa-brands fa-twitter"></i>
              <i class="fa-brands fa-square-youtube"></i>
            </div>
            <div class="col-lg-12 col-md-12">
              <div class="search-container mt-3">
                <input
                  type="text"
                  class="form-control search-input"
                  placeholder="Search..."
                />
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-1 col-md-6 col-6" style="">
          <img
            src="https://aktu.ac.in/images/sir-apjn.png"
            alt=""
            class="h-100 w-100"
          />
        </div>
        <div class="col-lg-1 col-md-6 col-6" style="">
            <img src="https://aktu.ac.in/images/naac%20a%20plus.jpg" alt="" class="h-100 w-100">
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
